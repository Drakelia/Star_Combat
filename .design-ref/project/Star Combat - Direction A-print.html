<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Star Combat — Direction A · Print</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; padding: 0; background: #08080c; color: #fff; }
  .page {
    width: 1920px; height: 1080px;
    position: relative;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .label {
    position: absolute; top: 16px; left: 16px;
    font-family: 'Space Mono', monospace; font-size: 14px;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: #ff2d55; z-index: 10;
    background: rgba(8,8,12,0.7); padding: 4px 10px;
    border: 1px solid #ff2d55;
  }
  /* Screen view: stack pages with padding */
  @media screen {
    body { padding: 24px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
    .page { box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  }
  /* Print: each page fills a landscape sheet */
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #08080c; }
    body { padding: 0; gap: 0; }
    .page {
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .label { display: none; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body>
<div id="p1" class="page"><div class="label">A · Start (v2)</div></div>
<div id="p2" class="page"><div class="label">A · HUD (v2)</div></div>
<div id="p3" class="page"><div class="label">A · End (v2)</div></div>
<div id="p4" class="page"><div class="label">A · Pause</div></div>
<div id="p5" class="page"><div class="label">A · Wave Clear</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="direction-a.jsx"></script>
<script type="text/babel" src="direction-a-v2.jsx"></script>

<script type="text/babel" data-presets="env,react">
  ReactDOM.createRoot(document.getElementById('p1')).render(<><div className="label">A · Start (v2)</div><A2Start /></>);
  ReactDOM.createRoot(document.getElementById('p2')).render(<><div className="label">A · HUD (v2)</div><A2Hud /></>);
  ReactDOM.createRoot(document.getElementById('p3')).render(<><div className="label">A · End (v2)</div><A2End /></>);
  ReactDOM.createRoot(document.getElementById('p4')).render(<><div className="label">A · Pause</div><A2Pause /></>);
  ReactDOM.createRoot(document.getElementById('p5')).render(<><div className="label">A · Wave Clear</div><A2WaveClear /></>);

  // Auto-print after fonts + render
  (async () => {
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
    await new Promise(r => setTimeout(r, 800));
    window.print();
  })();
</script>
</body>
</html>
